name: Auto Crawl blockmd-plugin Store Index

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: store-index-crawl
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Crawl topic:blockmd-plugin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/crawl_github.py

      - name: Commit updated store-index.json and changelogs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store-index.json changelogs/
          if ! git diff --cached --quiet; then
            CHANGED=$(git diff --cached --name-only)
            git commit -m "chore: update auto-crawled store-index.json and changelogs"
            git push
            for path in $CHANGED; do
              curl -fsSL "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/${path}" || true
            done
          fi
